[project]
name = "henan-travel-rag"
version = "0.1.0"
description = "基于 RAG 的河南旅游智能问答系统（LangGraph 编排 + Milvus 混合检索）"
requires-python = ">=3.11"
dependencies = [
    "colorlog",
    "end>=1.3.1",
    "fastapi>=0.141.1",
    "grandalf>=0.8",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "logging>=0.4.9.6",
    "minio>=7.2.20",
    "numpy>=2.4.6",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
    "flagembedding>=1.3.5",
    "transformers>=4.45.0,<5.0.0",
    "pymilvus[model]>=3.0.1",
    "modelscope>=1.39.1",
    "openai-agents>=0.22.0",
    "dashscope>=1.27.4",
    "ragas==0.3.9",
    "langchain-community==0.4.2",
]
[tool.uv.sources]
# 强制从 NVIDIA 源安装
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
